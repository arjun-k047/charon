# Local development only. The credentials are throwaway values matching
# DATABASE_URL in .env.example; never reuse them anywhere reachable.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: charon
      POSTGRES_PASSWORD: charon
      POSTGRES_DB: charon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is empty.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charon -d charon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
